# Docs site for Relay. Source is Markdown in docs/, so it lives in git, reviews
# in pull requests, and never drifts into a format nobody can edit.
#
#   ./.docs-venv/bin/mkdocs serve   # live preview on :8000
#   ./.docs-venv/bin/mkdocs build   # static site into site/ — open site/index.html
site_name: Relay Engineering Guide
site_description: How the Relay messaging platform works, end to end
docs_dir: docs
site_dir: site
use_directory_urls: false   # so site/index.html opens straight from a file share

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle: { icon: material/weather-night, name: Dark }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle: { icon: material/weather-sunny, name: Light }

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.inlinehilite
  - pymdownx.tabbed: { alternate_style: true }

# docs/superpowers/ holds the working plans this backend was built from. They are
# worth keeping in the repo and worth keeping out of the guide: a reader looking
# for how the product works should not land in a half-finished build plan from
# August. Excluding them also stops mkdocs warning about them on every build,
# which is what makes a real warning easy to miss.
exclude_docs: |
  superpowers/

plugins:
  - search
  - mermaid2

nav:
  - Start here: index.md
  - The product in one message: walkthrough.md
  - Every screen, every button: screens.md
  - Architecture and why: ARCHITECTURE.md
  - The send pipeline: pipeline.md
  - Money: money.md
  - Compliance: compliance.md
  - Analytics: analytics.md
  - Operator console: operator.md
  - Reliability: reliability.md
  - Numbers and deployment: numbers.md
  - What is not done: gaps.md
  - For the frontend team: ui-team.md
  - Handoff — frontend changes: handoff-ui.md
