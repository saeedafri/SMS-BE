# An address probing for paths that do not exist (/.env, /wp-admin, ...).
# Only paths outside /v1/ count, so a dashboard or integration asking for a
# record that is gone can never trip it; dashboard requests (bff 1) never count.
[Definition]
failregex = "client":"<HOST>",.*"path":"(?!/v1/)[^"]*",.*"status":404,.*"bff":"0"\}$
datepattern = "time":"%%Y-%%m-%%dT%%H:%%M:%%S%%z"
