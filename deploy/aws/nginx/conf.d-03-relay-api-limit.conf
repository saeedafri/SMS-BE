# Outer brake on every API route: one address may make 30 requests a second
# (burst 60) and hold 100 connections. Well above a real user or integration;
# a single-address flood is refused here before it costs the API anything.
# The API's own abuse guard (ABUSE_IP_PER_MINUTE) bans repeat offenders.
limit_req_zone $binary_remote_addr zone=relay_api:20m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=relay_conn:10m;
limit_conn_status 429;
