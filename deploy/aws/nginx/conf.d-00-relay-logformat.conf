# One JSON object per request, so CloudWatch Logs Insights can filter and
# aggregate on any field (status, latency, path, client) without regex.
# bff is 1 when the request carries the dashboard's X-Relay-BFF-Token header
# (the value is never logged). fail2ban never bans on those lines: their
# address is Vercel's, shared by every customer.
map $http_x_relay_bff_token $relay_bff { "" 0; default 1; }

log_format relay_json escape=json '{"time":"$time_iso8601","request_id":"$request_id",'
  '"client":"$remote_addr","xff":"$http_x_forwarded_for","host":"$host",'
  '"method":"$request_method","path":"$uri","query":"$args","status":$status,'
  '"bytes":$body_bytes_sent,"request_time":$request_time,'
  '"upstream_time":"$upstream_response_time","upstream_status":"$upstream_status",'
  '"user_agent":"$http_user_agent","referer":"$http_referer","bff":"$relay_bff"}';
