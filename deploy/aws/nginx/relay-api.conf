upstream relay_api {
    server 127.0.0.1:8080;
    keepalive 32;
}
server {
    server_name 3-111-226-170.sslip.io sms-api.saqibsaeed.cloud;
    access_log /var/log/nginx/relay-access.json relay_json;
    error_log  /var/log/nginx/relay-error.log warn;
    client_max_body_size 25M;
    gzip on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types application/json application/javascript text/css text/plain;
    location /v1/dev/ { return 403; }
    location ~ ^/v1/(auth/(login|signup|password/forgot|verify-email/resend|mfa/challenge)|operator/(login|mfa/challenge))$ {
        limit_req zone=relay_auth burst=20 nodelay;
        proxy_pass http://relay_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Connection "";
    }

    location / {
        proxy_pass http://relay_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/3-111-226-170.sslip.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/3-111-226-170.sslip.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot



}

server {
    if ($host = sms-api.saqibsaeed.cloud) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = 3-111-226-170.sslip.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name 3-111-226-170.sslip.io sms-api.saqibsaeed.cloud;
    return 404; # managed by Certbot




}