# Relay — sits alongside your existing Rentocloud and EMS containers.
#
# EVERY service has a HARD memory limit. That is the point of this file: on a
# shared VPS the real risk is not that Relay is slow, it is that Relay's
# ClickHouse decides to use 8 GB and the kernel OOM-kills your PRODUCTION app
# to get it back. ClickHouse ships with no query memory cap by default
# (max_memory_usage = 0, meaning unlimited), so leaving it unconfigured next to
# a production workload is the single most dangerous thing here.
#
# Total hard ceiling: 2 GB. Measured steady state is well under that — the
# headroom exists so a burst is absorbed rather than becoming an incident.
#
#   docker compose -f deploy/docker-compose.yml up -d

name: relay

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: [.env]
    environment:
      # GOMEMLIMIT makes Go's GC work HARDER as it approaches the limit rather
      # than waiting for the usual heap-doubling. Measured peak during a
      # 20,000-message burst was 510 MB with no limit; under this it stays
      # around 400 MB by collecting more often, trading a little CPU for
      # predictability on a shared box.
      GOMEMLIMIT: 400MiB
      GOGC: "80"
    ports:
      - "127.0.0.1:8080:8080"   # loopback only — Caddy fronts it
    depends_on:
      postgres: {condition: service_healthy}
      clickhouse: {condition: service_started}
    deploy:
      resources:
        limits: {memory: 512M, cpus: "1.5"}
        reservations: {memory: 128M}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      # Without this, JSON logs fill the disk. Unrotated container logs are a
      # very common way a VPS runs out of space months after a deploy.
      options: {max-size: "20m", max-file: "5"}

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sms
      POSTGRES_USER: sms_migrator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - relay_pgdata:/var/lib/postgresql/data
    # Deliberately NOT published to the host. Relay reaches it over the compose
    # network; nothing else can, and it cannot collide with EMS's Postgres.
    expose: ["5432"]
    command:
      # Sized for the limit below rather than the host's total RAM, which is
      # what Postgres would otherwise assume it owns.
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
      - -c
      - max_connections=50
    deploy:
      resources:
        limits: {memory: 512M, cpus: "1.0"}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sms_migrator -d sms"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: sms
      CLICKHOUSE_USER: relay
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - relay_chdata:/var/lib/clickhouse
      - ./clickhouse-limits.xml:/etc/clickhouse-server/config.d/limits.xml:ro
    expose: ["8123", "9000"]
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    deploy:
      resources:
        # The most important limit in this file. Measured peak during a
        # 20,000-message burst was 434 MB; 1 GB leaves room for merges without
        # letting it grow into your production app's memory.
        limits: {memory: 1G, cpus: "1.5"}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # maxmemory + allkeys-lru means Redis EVICTS rather than growing. Rate-limit
    # counters are disposable; losing the oldest costs one window of limiting,
    # while unbounded growth costs the whole machine.
    command: redis-server --maxmemory 96mb --maxmemory-policy allkeys-lru --save ""
    expose: ["6379"]
    deploy:
      resources:
        limits: {memory: 128M, cpus: "0.5"}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

volumes:
  relay_pgdata:
  relay_chdata:
