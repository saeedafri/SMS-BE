# Relay's infrastructure — sits alongside the existing Rentocloud and EMS
# services on the shared Hostinger VPS.
#
# Only TWO services here, and that is the point:
#
#   * Postgres is NOT in this file. Relay reuses the existing ems-postgres
#     container (a separate `sms` database and its own unprivileged roles), so
#     the second Postgres this file used to start — and its 512 MB — is gone.
#   * The API is NOT in this file either. It runs as a native systemd unit
#     (deploy/relay-api.service). That is not a style preference: ems-postgres
#     and ems-redis publish on 127.0.0.1 only, which a container cannot reach
#     through host-gateway, and joining EMS's docker network would mean
#     reaching into another team's stack.
#
# EVERY service has a HARD memory limit. On a shared VPS the real risk is not
# that Relay is slow, it is that Relay's ClickHouse decides to use 8 GB and the
# kernel OOM-kills the PRODUCTION app to get it back — the kernel picks the
# biggest process, not the guilty one. ClickHouse ships with no query memory cap
# at all (max_memory_usage = 0, meaning unlimited), so leaving it unconfigured
# next to a production workload is the single most dangerous thing here.
#
#   docker compose -f deploy/docker-compose.yml up -d

name: relay

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: sms
      CLICKHOUSE_USER: relay
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - relay_chdata:/var/lib/clickhouse
      - ./clickhouse-limits.xml:/etc/clickhouse-server/config.d/limits.xml:ro
    ports:
      # Loopback only. The systemd API unit runs on the host and reaches it
      # here; nothing off-box can. 8123 and 9000 were both free on this VPS.
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    deploy:
      resources:
        # The most important limit in this file. Measured peak during a
        # 20,000-message burst was 434 MB; 1 GB leaves room for merges without
        # letting it grow into the production app's memory.
        limits: {memory: 1G, cpus: "1.0"}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      # Without this, JSON logs fill the disk. Unrotated container logs are a
      # very common way a VPS runs out of space months after a deploy.
      options: {max-size: "10m", max-file: "3"}

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Deliberately NOT the existing ems-redis. That instance runs
    # maxmemory-policy noeviction, so anything of ours that filled its 200 MB
    # would start failing EMS's writes — a Relay load spike becoming an EMS
    # incident. A dedicated instance costs about 9 MB resident, which is less
    # than that risk is worth.
    #
    # maxmemory + allkeys-lru means this one EVICTS rather than growing.
    # Rate-limit counters are disposable; losing the oldest costs one window of
    # limiting, while unbounded growth costs the whole machine.
    command: redis-server --maxmemory 96mb --maxmemory-policy allkeys-lru --save ""
    ports:
      # 6380, not 6379: ems-redis already holds 6379 on loopback.
      - "127.0.0.1:6380:6379"
    deploy:
      resources:
        limits: {memory: 128M, cpus: "0.5"}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

volumes:
  relay_chdata:
