# /etc/nginx/sites-available/relay-api on the Hostinger server, linked from
# sites-enabled. The public API, https://srv2130239.hstgr.cloud, in front of
# the relay-test-api container on 127.0.0.1:8080. The name is the free hostname
# Hostinger gives this server; hstgr.cloud is a public suffix, so the
# certificate is this server's own and shares no rate limit.
#
# This is Relay's ONLY file in that nginx. The other sites on the server
# (textifydigitals.io, default) are not Relay's: never edit them. Install by
# hand, not from the deploy workflow:
#   nginx -t && systemctl reload nginx
# The certificate is certbot's (webroot /var/www/relay-acme); certbot.timer
# renews it and its deploy hook reloads nginx.

# Outer brakes, per client address. The API applies the real per-account and
# per-IP lockouts (ABUSE_IP_PER_MINUTE) behind these.
limit_req_zone $binary_remote_addr zone=relay_auth:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=relay_api:20m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=relay_conn:10m;

upstream relay_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name srv2130239.hstgr.cloud;
    location /.well-known/acme-challenge/ { root /var/www/relay-acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # IPv4 only, like the other site on this nginx: a [::]:443 listener here
    # would become the IPv6 default for every hostname on the server.
    listen 443 ssl;
    server_name srv2130239.hstgr.cloud;
    ssl_certificate     /etc/letsencrypt/live/srv2130239.hstgr.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/srv2130239.hstgr.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:relay_ssl:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/relay-access.log;
    error_log  /var/log/nginx/relay-error.log warn;
    client_max_body_size 25M;
    gzip on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types application/json application/javascript text/css text/plain;
    limit_req_status 429;
    limit_conn_status 429;

    # The unauthenticated test hooks never leave the server.
    location /v1/dev/ { return 403; }

    # Route timings and worker incidents are for the box, not the internet.
    # Read them on 127.0.0.1:8080/metrics, or over an SSH tunnel.
    location = /metrics { return 403; }

    # Every route that takes a password, a code or an address.
    location ~ ^/v1/(auth/(login|signup|password/forgot|password/reset|verify-email/resend|mfa/challenge)|operator/(login|login/mfa))$ {
        limit_req zone=relay_auth burst=20 nodelay;
        proxy_pass http://relay_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Connection "";
    }

    location / {
        limit_req zone=relay_api burst=60 nodelay;
        limit_conn relay_conn 100;
        proxy_pass http://relay_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Connection "";
        # Event streams stay open; do not buffer or cut them.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
