# Relay's public entry point: /etc/nginx/sites-available/sms-api.saqibsaeed.cloud
#
# nginx, not the Caddyfile beside this. This VPS already runs nginx on 80/443
# for Rentocloud and EMS; installing Caddy would leave two servers fighting over
# the same ports and take those sites down with us.
#
# Certbot rewrites this file when it issues the certificate — it appends the
# listen 443 / ssl_certificate lines and the port-80 redirect. Keep this as the
# plain HTTP form so `certbot --nginx -d sms-api.saqibsaeed.cloud` works on a
# fresh box.

upstream relay_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name sms-api.saqibsaeed.cloud;

    # CSV contact imports are the largest thing a tenant uploads.
    client_max_body_size 25M;

    gzip on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types application/json application/javascript text/css text/plain;

    # The dev test hooks are NOT reachable from the internet.
    #
    # /v1/dev/* is unauthenticated BY DESIGN — it falls back to the fixture
    # tenant when no session is present, because Playwright's `request` fixture
    # carries none of the browser's cookies. One of those routes,
    # reset-mock-state, drops and rebuilds the entire demo dataset; another
    # changes the caller's own role. Published, they would let anyone wipe the
    # demo mid-presentation.
    #
    # The browser suite reaches them over an SSH tunnel straight to :8080,
    # which never passes through nginx. So this block costs the suite nothing
    # and closes the hole completely.
    location /v1/dev/ {
        return 403;
    }

    location / {
        proxy_pass http://relay_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Campaign sends and CSV imports are the slow paths; the API's own
        # timeouts are shorter than this, so nginx never cuts off a request the
        # application still considers live.
        proxy_read_timeout 120s;
    }
}
