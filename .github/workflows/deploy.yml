name: Deploy to Hostinger

# Push to main -> verify, build, deploy to the Hostinger server (189.72.144.98,
# public API https://srv2130239.hstgr.cloud),
# where Relay runs as the docker compose project `relay-test` in /opt/relay-test.
#
# That server also runs things that are not Relay's: nginx on :80/:443,
# postgresql@17 on :5432, a Next.js app on :3000, smpp-v3. Every step here is
# scoped to Relay's own compose project, files and backup timer: nothing
# restarts docker, touches nginx or another service, installs a package or
# changes a firewall rule.
#
# Secrets: HOSTINGER_HOST, HOSTINGER_USER, HOSTINGER_SSH_KEY. The application's
# own secrets never leave the server (/opt/relay-test/.env and api.env).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never two deploys at once: they would race on the same image tag and the
# same migration lock. cancel-in-progress is deliberately OFF — killing a
# half-finished deploy is worse than queueing behind it.
concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

env:
  # goose is not a dependency of this module; it is built and uploaded only
  # when the server does not already have this exact version.
  GOOSE_VERSION: v3.22.1

jobs:
  deploy:
    name: Verify and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      # vet, the tests and the release build run at the same time and the step
      # fails if ANY of them does. Nothing is uploaded until all three pass.
      #
      # The tests that need Postgres, ClickHouse and Redis skip here — the
      # runner has none. The full suite runs on the server against the real
      # datastores (`make test`) before every push; this is the
      # compile-and-pure-logic gate.
      - name: Vet, test and build
        run: |
          mkdir -p out
          go vet ./... > vet.log 2>&1 & vet=$!
          go test ./... > test.log 2>&1 & tst=$!
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags="-s -w -X main.commit=$GITHUB_SHA" \
            -o out/ ./cmd/control-api ./cmd/seed-demo ./cmd/operator-admin > build.log 2>&1 & bld=$!
          status=0
          wait $vet || { echo "::error::go vet failed"; status=1; }
          wait $tst || { echo "::error::go test failed"; status=1; }
          wait $bld || { echo "::error::build failed"; status=1; }
          for f in vet test build; do echo "::group::$f"; cat "$f.log"; echo "::endgroup::"; done
          ls -lh out/
          exit $status

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Best-effort known_hosts seed; never fatal. accept-new is the fallback.
          ssh-keyscan -T 15 -H "${{ secrets.HOSTINGER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
          printf 'Host relay\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n  BatchMode yes\n  StrictHostKeyChecking accept-new\n  ConnectTimeout 20\n  ServerAliveInterval 30\n  ControlMaster auto\n  ControlPath ~/.ssh/cm-%%r@%%h:%%p\n  ControlPersist 5m\n' \
            "${{ secrets.HOSTINGER_HOST }}" "${{ secrets.HOSTINGER_USER }}" > ~/.ssh/config

      - name: Build goose only if the server lacks it
        run: |
          have=$(ssh relay '/opt/relay-test/goose -version 2>/dev/null' || true)
          if echo "$have" | grep -q "$GOOSE_VERSION"; then
            echo "server already has goose $GOOSE_VERSION"
          else
            echo "server has '${have:-no goose}'; building $GOOSE_VERSION"
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 GOBIN="$PWD/out" \
              go install -trimpath -ldflags="-s -w" "github.com/pressly/goose/v3/cmd/goose@$GOOSE_VERSION"
          fi

      # One compressed stream over one connection. The server has no rsync and
      # installing packages there is not ours to do, so it is tar over ssh.
      - name: Upload
        run: |
          mkdir -p stage/release/bin
          cp out/control-api out/seed-demo out/operator-admin stage/release/bin/
          [ -f out/goose ] && cp out/goose stage/goose
          cp -r db stage/release/
          cp deploy/Dockerfile stage/release/
          cp deploy/docker-compose.yml deploy/clickhouse-limits.xml scripts/clickhouse_migrate.py \
             deploy/relay-backup.sh deploy/relay-backup.service deploy/relay-backup.timer stage/
          tar -czf - -C stage . | ssh relay \
            'rm -rf /opt/relay-test/incoming && mkdir -p /opt/relay-test/incoming && tar -xzf - -C /opt/relay-test/incoming'

      - name: Migrate, swap, verify, roll back on failure
        run: |
          ssh relay "SHA=$GITHUB_SHA bash -se" <<'EOSSH'
          set -euo pipefail
          cd /opt/relay-test
          I=/opt/relay-test/incoming

          # First-time setup (secrets, roles, databases) is done by hand on the
          # server; a deploy that finds none of it stops here rather than
          # inventing passwords.
          [ -f .env ] && [ -f api.env ] || { echo "::error::/opt/relay-test/.env or api.env missing"; exit 1; }
          set -a; . ./.env; set +a

          install -m 644 "$I/docker-compose.yml" "$I/clickhouse-limits.xml" "$I/clickhouse_migrate.py" ./
          install -m 755 "$I/relay-backup.sh" ./
          [ -f "$I/goose" ] && install -m 755 "$I/goose" ./goose
          rm -rf release && mv "$I/release" release

          echo "::group::datastores"
          # Applies any change to their definitions (limits, images); a no-op
          # otherwise.
          docker compose up -d --wait postgres clickhouse redis
          echo "::endgroup::"

          echo "::group::backup"
          mkdir -p backups
          docker exec relay-test-postgres pg_dump -U postgres -d sms \
            | gzip > "backups/sms_predeploy_$(date +%Y%m%d_%H%M%S).sql.gz"
          ls -t backups/sms_predeploy_*.sql.gz | tail -n +15 | xargs -r rm -f
          echo "::endgroup::"

          echo "::group::migrate"
          # BEFORE the swap: a failed migration leaves the old API serving.
          (cd release && ../goose -dir db/migrations postgres \
            "postgres://sms_migrator:$SMS_MIGRATOR_PASSWORD@127.0.0.1:15432/sms?sslmode=disable" up)
          (cd release && CLICKHOUSE_HTTP=http://127.0.0.1:8123 CLICKHOUSE_USER=relay \
            CLICKHOUSE_PASSWORD="$CLICKHOUSE_PASSWORD" python3 ../clickhouse_migrate.py sms)
          echo "::endgroup::"

          echo "::group::swap"
          # Keep the outgoing image: without it there is nothing to roll back to.
          docker image inspect relay-test-api:latest >/dev/null 2>&1 \
            && docker tag relay-test-api:latest relay-test-api:prev
          docker compose build -q api
          docker compose up -d --no-deps api
          install -m 644 "$I/relay-backup.service" "$I/relay-backup.timer" /etc/systemd/system/
          systemctl daemon-reload
          systemctl enable --now relay-backup.timer
          echo "::endgroup::"

          echo "::group::verify"
          for i in $(seq 1 30); do
            health=$(curl -sf --max-time 3 http://127.0.0.1:8080/healthz || true)
            if echo "$health" | grep -q '"status":"ok"' && echo "$health" | grep -q "\"commit\":\"$SHA\""; then
              echo "healthy on $SHA after ${i} attempt(s): $health"
              docker image prune -f >/dev/null
              exit 0
            fi
            sleep 3
          done

          echo "NEW API DID NOT BECOME HEALTHY ON $SHA — rolling back" >&2
          docker logs --tail 40 relay-test-api >&2 || true
          if docker image inspect relay-test-api:prev >/dev/null 2>&1; then
            docker tag relay-test-api:prev relay-test-api:latest
            docker compose up -d --no-deps --no-build api
            sleep 5
            curl -s http://127.0.0.1:8080/healthz >&2 || true
            echo "rolled back to the previous image" >&2
          fi
          exit 1
          EOSSH

      - name: Confirm public endpoint
        # Through nginx and TLS, from outside the server — the loopback check
        # above would pass even if the public route were broken.
        run: |
          base="https://srv2130239.hstgr.cloud"
          body=$(curl -s --max-time 20 "$base/healthz")
          echo "$base/healthz -> $body"
          echo "$body" | grep -q "\"commit\":\"$GITHUB_SHA\""
          # The test hooks must never become publicly reachable by accident.
          dev=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -X POST "$base/v1/dev/reset-mock-state")
          echo "/v1/dev/reset-mock-state -> $dev (expect 403 or 404)"
          [ "$dev" = "403" ] || [ "$dev" = "404" ]
