name: Send Handoff

# Fires automatically the moment a handoff file is pushed — no command to run.
# Fill in when installing this template into a repo:
#   TARGET_REPO: the other repo, "owner/repo", e.g. saeedafri/SMS-BE
#   HANDOFF_GLOB: this repo's own handoff-file naming convention, must match
#     the `paths:` filter below exactly (e.g. "docs/HANDOFF_TO_UI_*.md")
# Also set `on.push.branches` below to this repo's actual default branch.

on:
  push:
    branches: [main]
    paths:
      - "docs/HANDOFF_TO_UI_*.md"

env:
  TARGET_REPO: "SAQIBJH/sms-platform-frontend"
  HANDOFF_GLOB: "docs/HANDOFF_TO_UI_*.md"

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find changed handoff files and dispatch each one
        env:
          GH_TOKEN: ${{ secrets.RELAY_BRIDGE_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          after="${{ github.event.after }}"
          empty_tree="4b825dc642cb6eb9a060e54bf8d69288fbee4904"
          if [ "$before" = "0000000000000000000000000000000000000000" ]; then
            before="$empty_tree"
          fi

          changed=$(git diff --name-only --diff-filter=AM "$before" "$after" -- $HANDOFF_GLOB || true)
          if [ -z "$changed" ]; then
            echo "no matching handoff files changed in this push"
            exit 0
          fi

          repo_slug="$GITHUB_REPOSITORY"

          while IFS= read -r file; do
            echo "dispatching handoff: $file -> $TARGET_REPO"
            status=$(curl -sf -o /dev/null -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${TARGET_REPO}/dispatches" \
              -d "{\"event_type\":\"handoff\",\"client_payload\":{\"source_repo\":\"${repo_slug}\",\"ref\":\"${after}\",\"handoff_path\":\"${file}\"}}")
            if [ "$status" != "204" ]; then
              echo "::error::dispatch for $file failed with HTTP $status"
              exit 1
            fi
          done <<< "$changed"
